# ------------------------------------------------------------------
#  MediaMTX Recording Manager — instalación genérica
#  Pensado para desplegar en CUALQUIER servidor que ya tenga un
#  contenedor de MediaMTX corriendo. No contiene datos de ninguna red
#  en concreto: todo se configura vía el archivo .env de esta carpeta.
#
#  USO (imagen ya publicada, sin clonar el código — recomendado):
#    1. cp .env.example .env  (edita con los datos de tu servidor)
#    2. docker compose pull
#    3. docker compose up -d
#
#  USO (construir tú mismo desde el código, si clonaste el repo):
#    docker compose up -d --build
#
#  En ambos casos, accede luego a http://<tu-servidor>:MANAGER_PORT
#  (ver README.md de esta carpeta).
# ------------------------------------------------------------------

services:
  mediamtx-manager:
    image: ghcr.io/tomasrecvi/control-mediamtx:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mediamtx-manager
    restart: unless-stopped
    ports:
      - "${MANAGER_PORT:-8080}:8080"
    environment:
      MEDIAMTX_API: "${MEDIAMTX_API}"
      AUTH_USERNAME: "${AUTH_USERNAME:-admin}"
      AUTH_PASSWORD: "${AUTH_PASSWORD}"
    volumes:
      - mediamtx_data:/data
    networks:
      - mediamtx_net

# Los nombres de la izquierda (mediamtx_net, mediamtx_data) son solo alias
# internos de este archivo: Compose no permite variables de entorno como
# clave de "networks:"/"volumes:", así que el nombre REAL externo se pasa
# con "name:", que sí admite variables.
networks:
  mediamtx_net:
    external: true
    name: ${MEDIAMTX_NETWORK}

volumes:
  mediamtx_data:
    external: true
    name: ${MEDIAMTX_DATA_VOLUME}
