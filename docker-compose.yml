# ------------------------------------------------------------------
#  MediaMTX Recording Manager
#  Despliega junto al contenedor mediamtx existente.
#
#  USO:
#    1. Copia esta carpeta al servidor Linux (192.168.1.147)
#    2. cd mediamtx-manager
#    3. docker compose up -d --build
#    4. Abre http://192.168.1.147:8080 en el navegador
#
#  NOTA sobre MEDIAMTX_API: se usa la IP del propio servidor (no el nombre
#        del contenedor) porque el puerto 9997 de MediaMTX ya está publicado
#        en el host. Funciona sin importar en qué red Docker esté este
#        contenedor -- a diferencia de usar el nombre del contenedor, que
#        solo resuelve si ambos están en la misma red de Docker.
#        Solo se usa la PRIMERA vez que arranca: después se puede cambiar
#        desde el propio panel (⚙ Configuración) sin tocar este archivo.
# ------------------------------------------------------------------

services:
  mediamtx-manager:
    build: .
    container_name: mediamtx-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # IP del servidor + puerto de la API de MediaMTX (9997, publicado en el host).
      MEDIAMTX_API: "http://192.168.1.147:9997"
      # Credenciales iniciales de acceso al panel (usuario: admin / admin).
      # Solo se usan la PRIMERA vez que arranca; después se pueden cambiar
      # desde el propio panel (⚙ Configuración) y quedan guardadas en el
      # volumen de datos, sin depender ya de estas variables.
      AUTH_USERNAME: "admin"
      AUTH_PASSWORD: "admin"
    volumes:
      # Monta el volumen de datos de MediaMTX (solo lectura)
      # para poder servir los videos de las grabaciones.
      - mediamtx_data:/data
    networks:
      - mediamtx_default

# ------------------------------------------------------------------
#  Red: usa la red existente de MediaMTX para comunicarse.
# ------------------------------------------------------------------
networks:
  mediamtx_default:
    external: true

# ------------------------------------------------------------------
#  Volumen: el volumen donde MediaMTX guarda las grabaciones.
# ------------------------------------------------------------------
volumes:
  mediamtx_data:
    external: true
