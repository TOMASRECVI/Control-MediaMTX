<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sever video</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--card:#1c2333;
  --border:#30363d;--text:#e6edf3;--muted:#8b949e;
  --accent:#58a6ff;--red:#f85149;--green:#3fb950;
  --radius:10px;--shadow:0 2px 12px rgba(0,0,0,.4);
}
html{font-size:15px}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
}
.login-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);width:100%;max-width:340px;padding:1.75rem 1.5rem;
}
.login-title{display:flex;align-items:center;gap:.5rem;font-size:1.15rem;font-weight:600;margin-bottom:1.25rem}
.login-title .dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.4px}
.field input{
  width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface);color:var(--text);font-size:.95rem;font-family:inherit;
}
.field input:focus{outline:none;border-color:var(--accent)}
.btn-login{
  width:100%;padding:10px;border:none;border-radius:6px;background:var(--accent);
  color:#04121f;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:.4rem;transition:.15s;
}
.btn-login:hover{opacity:.9}
.error-box{
  background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.3);color:var(--red);
  font-size:.82rem;padding:.6rem .75rem;border-radius:6px;margin-bottom:1rem;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-title"><span class="dot"></span> Sever video</div>
  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/login">
    <div class="field">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login">Entrar</button>
  </form>
</div>

</body>
</html>
