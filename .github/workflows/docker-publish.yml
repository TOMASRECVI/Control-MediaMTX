name: Build and publish Docker image

# Construye la imagen y la publica en GitHub Container Registry (ghcr.io)
# en cada push a main, y también con cualquier tag "vX.Y.Z" para versiones.
# No requiere ningún secreto configurado a mano: usa el GITHUB_TOKEN que
# Actions ya proporciona automáticamente para este mismo repositorio.

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

env:
  # Nombre de la imagen en minúsculas (obligatorio para cualquier registro
  # de contenedores), fijo para no depender del casing del propietario/repo.
  IMAGE_NAME: ghcr.io/tomasrecvi/control-mediamtx

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer etiquetas (latest en main, versión si es un tag vX.Y.Z)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
